<style>
:root{--bg:#f3f5f7;--panel:#ffffff;--txt:#1c2a39;--mut:#6b7c8e;--go:#2fae7c;--warn:#e3a82a;--old:#a5b0bc;--chip:#eef2f6;--fade:243,245,247;--wash:255,255,255;--tb:#1c2a39;--tbt:#fff;--sp:#fff;--cb:#1c2a39;--cbt:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;touch-action:manipulation;-webkit-text-size-adjust:100%}

body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--txt);background:var(--bg);overflow:hidden;-webkit-user-select:none;user-select:none}
#map{position:fixed;inset:0;z-index:0;background:var(--bg)}
.leaflet-container{background:var(--bg)}
.leaflet-tile-pane{filter:saturate(.85) brightness(1.03) contrast(.96)}

#badge>span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis}#compass{display:none;margin-left:auto}#compass+.fab{margin-left:0}#compass svg{transition:transform .15s}
.maplibregl-canvas{outline:none}
.spotwrap{pointer-events:auto}

button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.top{position:fixed;z-index:500;left:14px;right:14px;top:max(12px,env(safe-area-inset-top));display:flex;gap:10px;align-items:center;pointer-events:none}
.badge{min-width:0;overflow:hidden;white-space:nowrap;cursor:pointer;pointer-events:auto;display:flex;align-items:center;gap:11px;background:rgba(var(--wash),.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:28px;padding:10px 18px 10px 14px;box-shadow:0 4px 18px rgba(28,42,57,.14);font-weight:600;font-size:16px;min-height:52px;transition:opacity .4s}
.badge .dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--go);box-shadow:0 0 0 5px rgba(47,174,124,.2)}
.badge.none .dot{background:#aab5c0;box-shadow:none}
.badge small{display:block;font-weight:400;font-size:12.5px;color:var(--mut);margin-top:1px}
.fab,.lang{pointer-events:auto;flex:none;width:44px;height:44px;border-radius:50%;background:var(--panel);box-shadow:0 4px 18px rgba(28,42,57,.14);display:flex;align-items:center;justify-content:center;color:#3b6fd8;font-weight:600;font-size:14px}
.fab{margin-left:auto}
#toast{position:fixed;z-index:700;left:14px;right:14px;top:calc(max(12px,env(safe-area-inset-top)) + 108px);display:flex;justify-content:center;pointer-events:none}
.tbox{pointer-events:auto;display:flex;gap:14px;align-items:center;background:var(--tb);color:var(--tbt);border-radius:18px;padding:12px 16px;box-shadow:0 8px 24px rgba(28,42,57,.28);font-weight:500;max-width:560px;font-size:15px}
.tbox button{background:transparent;color:#9cc0ff;font-weight:600;padding:6px 8px}
.card{position:fixed;z-index:600;left:14px;right:14px;bottom:calc(196px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;background:var(--panel);border-radius:22px;padding:16px;box-shadow:0 10px 30px rgba(28,42,57,.18)}
.card h2{margin:0;font-size:19px;font-weight:600;padding-right:44px}
.card .sub{color:var(--mut);margin-top:3px;font-size:14px}
.card .acts{display:flex;gap:8px;margin-top:14px}
.card .acts a,.card .acts button{flex:1;min-width:0;text-align:center;text-decoration:none;border-radius:14px;padding:13px 6px;font-weight:600;font-size:15px;background:var(--chip);color:var(--txt)}
.card .acts .ir{background:#3b6fd8;color:#fff}.card .acts a{font-size:14px}
.card .acts button[disabled]{opacity:.55}
.x{position:absolute;right:10px;top:10px;width:38px;height:38px;border-radius:50%;background:var(--chip);font-size:20px;line-height:1;color:var(--mut)}
.bottom{position:fixed;z-index:500;left:0;right:0;bottom:0;padding:0 14px calc(14px + env(safe-area-inset-bottom));pointer-events:none}
.hint{pointer-events:auto;width:max-content;max-width:calc(100% - 8px);margin:0 auto 10px;padding:8px 16px;border-radius:20px;background:rgba(var(--wash),.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 2px 12px rgba(28,42,57,.12);color:var(--mut);font-size:13.5px;font-weight:500;text-align:center;line-height:1.35}
.hint:empty{display:none}
.big{pointer-events:auto;display:flex;gap:6px;max-width:560px;margin:0 auto;padding:8px;border-radius:30px;background:rgba(var(--wash),.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 8px 30px rgba(28,42,57,.18)}
.big button{flex:1;min-width:0;border-radius:22px;padding:12px 2px 11px;background:transparent;color:var(--txt);display:flex;flex-direction:column;align-items:center;gap:7px;font-weight:600;font-size:13.5px;letter-spacing:.1px;transition:transform .15s,background .15s}

.big .ic{width:46px;height:46px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.big .ic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.big .go .ic{background:rgba(47,174,124,.14);color:#1f9a6a}
.big .park .ic{background:rgba(59,111,216,.13);color:#3b6fd8}
.big .see .ic{background:rgba(42,154,168,.14);color:#238a97}
.big .lb{line-height:1.15;text-align:center;padding:0 2px}

.spotwrap{background:transparent;border:0}
.spot{position:relative;width:50px;height:50px;border-radius:50%;border:3px solid var(--sp);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;line-height:1;box-shadow:0 4px 14px rgba(28,42,57,.3);transition:transform .3s}
.spot b{font-size:20px}.spot i{font-style:normal;font-size:10.5px;font-weight:600;margin-top:1px}
.spot.f{background:var(--go)}.spot.m{background:var(--warn);color:#3a2a00}.spot.o{background:var(--old)}
.spot .cnt{position:absolute;top:-9px;right:-9px;min-width:22px;height:22px;border-radius:11px;background:var(--cb);color:var(--cbt);border:2px solid var(--sp);font-style:normal;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.chips{display:flex;gap:8px;margin-top:12px}
.chips button{flex:1;min-width:0;padding:12px 4px;border-radius:14px;background:var(--chip);color:var(--txt);font-weight:600;font-size:15px}
.chips button.on{background:#3b6fd8;color:#fff}
.sheet .sub{margin-top:11px;font-size:13px}.sheet .chips{margin-top:7px}.sheet h2+.sub{margin-top:10px}
.pills{position:fixed;z-index:500;left:14px;right:14px;top:calc(max(12px,env(safe-area-inset-top)) + 62px);display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
.pills button{pointer-events:auto;height:34px;padding:0 13px;border-radius:17px;background:rgba(var(--wash),.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 3px 12px rgba(28,42,57,.14);font-weight:600;font-size:13px;color:var(--txt);white-space:nowrap}
.pills button.on{background:var(--go);color:#fff}
.spot .zt{position:absolute;right:-5px;bottom:-5px;width:17px;height:17px;border-radius:50%;border:2px solid var(--sp)}.z-blue{background:#2f6fe0}.z-green{background:#0b7a45}
.spot.sel{transform:scale(1.22)}
.spot.f::after{content:'';position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--go);opacity:0;animation:pulse 2.6s ease-out infinite}
@keyframes pulse{0%{transform:scale(.75);opacity:.6}100%{transform:scale(1.4);opacity:0}}
.me{width:20px;height:20px;border-radius:50%;background:#2f80ff;border:4px solid #fff;box-shadow:0 0 0 7px rgba(47,128,255,.22),0 2px 8px rgba(28,42,57,.3)}
#onb{position:fixed;z-index:900;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px}
.onbbox{max-width:360px;width:100%;text-align:center}
.onbp{width:118px;height:118px;border-radius:50%;background:var(--go);color:#fff;font-size:68px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 30px;box-shadow:0 0 0 14px rgba(47,174,124,.16),0 0 0 32px rgba(47,174,124,.08)}
.onbbox h1{font-size:28px;font-weight:600;margin:0 0 12px;line-height:1.2}
.onbbox p{font-size:17px;line-height:1.5;color:var(--mut);margin:0 0 12px}
.onbbox .tip{font-size:14px;color:#8a98a6}
.dots{display:flex;gap:8px;justify-content:center;margin:26px 0 22px}
.dots i{height:8px;border-radius:4px;background:var(--go);transition:width .3s}
#onbn{width:100%;height:58px;border-radius:20px;background:var(--go);color:#fff;font-size:18px;font-weight:600}
html[data-theme=dark]{--bg:#0e1621;--panel:#142130;--txt:#e7eef6;--mut:#9db0c4;--go:#3fbf8a;--warn:#d9b44a;--old:#8794a6;--chip:#1e2d3f;--fade:14,22,33;--wash:20,33,48;--tb:#e7eef6;--tbt:#14202e;--sp:#e7eef6;--cb:#0e1621;--cbt:#e7eef6}

html[data-theme=dark] .spot.o{color:#0e1621}

.spot.zb{background:#2f6fe0;color:#fff!important}.spot.zg{background:#0b7a45;color:#fff!important}.spot.zo{background:#ec6a1d;color:#fff!important}.spot.pm{background:#6b4fd1;color:#fff!important}
.spot.zb.o,.spot.zg.o,.spot.zo.o,.spot.pm.o{opacity:.72}
.spot.zb::after{border-color:#2f6fe0}.spot.zg::after{border-color:#0b7a45}.spot.zo::after{border-color:#ec6a1d}.spot.pm::after{border-color:#6b4fd1}
.spot.pm b{display:flex}.spot .wc{width:26px;height:26px;fill:#fff}.pills .wc,.chips .wc,.card .wc{width:17px;height:17px;fill:currentColor;vertical-align:-3px;margin-right:5px}.pills button.pm .wc{fill:#fff}
.tbox.tz-free{background:#1f9a6a}.tbox.tz-blue{background:#2f6fe0}.tbox.tz-green{background:#0b7a45}.tbox.tz-orange{background:#ec6a1d}.tbox.tz-pmr{background:#6b4fd1}
.tbox[class*=tz-]{color:#fff!important}
.tbox[class*=tz-] button{color:#fff!important;background:rgba(255,255,255,.22);border-radius:12px;padding:8px 12px}
.chips button.pm,.pills button.pm{background:#6b4fd1!important;color:#fff!important}
.chips{flex-wrap:wrap}

  function parseCol(v){
    var s=String(v).trim(), m, r, g, b, a=1;
    if((m=s.match(/^#([0-9a-f]{3,8})$/i))){ var x=m[1]; if(x.length<=4) x=x.split('').map(function(c){ return c+c; }).join(''); r=parseInt(x.substr(0,2),16); g=parseInt(x.substr(2,2),16); b=parseInt(x.substr(4,2),16); if(x.length===8) a=parseInt(x.substr(6,2),16)/255; }
    else if((m=s.match(/^rgba?\(([^)]+)\)$/i))){ var q=m[1].split(','); r=+q[0]; g=+q[1]; b=+q[2]; if(q.length>3) a=+q[3]; }
    else if((m=s.match(/^hsla?\(([^)]+)\)$/i))){ var w=m[1].split(','); return [+w[0],parseFloat(w[1])/100,parseFloat(w[2])/100,w.length>3?+w[3]:1]; }
    else return null;
    r/=255; g/=255; b/=255;
    var mx=Math.max(r,g,b), mn=Math.min(r,g,b), l=(mx+mn)/2, h=0, sa=0;
    if(mx!==mn){ var d=mx-mn; sa=l>.5?d/(2-mx-mn):d/(mx+mn); h=mx===r?((g-b)/d+(g<b?6:0)):(mx===g?(b-r)/d+2:(r-g)/d+4); h*=60; }
    return [h,sa,l,a];
  }

  function mapCols(v,fn){
    if(typeof v==='string') return /^\s*(#|rgb|hsl)/i.test(v)?fn(v):v;
    if(Array.isArray(v)) return v.map(function(x){ return mapCols(x,fn); });
    if(v&&typeof v==='object'&&v.stops) return {base:v.base,stops:v.stops.map(function(st){ return [st[0],mapCols(st[1],fn)]; })};
    return v;

  function darkenStyle(st){
    var BG='#0F1117';
    (st.layers||[]).forEach(function(ly){
      var id=ly.id, t=ly.type, p=ly.paint=ly.paint||{}, set=function(k,v){ if(k in p) p[k]=v; }, c=null;
      if(t==='background'){ p['background-color']=BG; return; }
      if(t==='fill'||t==='fill-extrusion'){
        if(id==='water'||id==='water-intermittent') c='#10193A';
        else if(/^(park|landcover-(wood|grass|grass-park))/.test(id)) c='#141A18';
        else if(/landcover-(sand|glacier|ice)/.test(id)) c='#171d25';
        else if(id==='landuse-cemetery') c='#13201b';
        else if(/landuse-(hospital|school)/.test(id)) c='#17202b';
        else if(id==='landuse-industrial') c='#151b24';
        else if(id==='landuse-commercial') c='#161d27';
        else if(/^landuse/.test(id)) c='#121922';
        else if(id==='building') c='#1B1E27';
        else if(id==='building-top') c='#222a37';
        else if(/area|pier/.test(id)) c='#1a212c';
        if(c){ set('fill-color',c); set('fill-extrusion-color',c); set('fill-outline-color',/building/.test(id)?'#283040':c); }
        else Object.keys(p).forEach(function(k){ if(/color/.test(k)) p[k]=mapCols(p[k],darkCol); });
      }else if(t==='line'){
        if(/waterway/.test(id)) c='#10344b';
        else if(/hatching/.test(id)) c='#242c38';
        else if(/casing/.test(id)) c='#0b0f14';
        else if(/motorway/.test(id)) c='#62748c';
        else if(/trunk|primary/.test(id)) c='#4b5a70';
        else if(/secondary|tertiary/.test(id)) c='#3d495c';
        else if(/minor|link|service/.test(id)) c='#303b4d';
        else if(/path/.test(id)) c='#2b3442';
        else if(/railway|transit/.test(id)) c='#2b3341';
        else if(/boundary/.test(id)) c='#3a4558';
        else if(/ferry|cablecar/.test(id)) c='#2d4d78';
        else if(/aeroway/.test(id)) c='#303b4d';
        if(c) set('line-color',c);
        else Object.keys(p).forEach(function(k){ if(/color/.test(k)) p[k]=mapCols(p[k],darkCol); });
      }else if(t==='symbol'){
        var tc='#c8d2de', hc='#0F1117';
        if(/^label_(city|country|state)/.test(id)) tc='#e8eef6';
        else if(/water/.test(id)){ tc='#6f93b3'; hc='#10193A'; }
        else if(/^highway-name/.test(id)) tc='#aebacb';
        else if(/^poi|airport/.test(id)) tc='#8fa1b5';
        p['text-color']=tc; p['text-halo-color']=hc;
        if(!p['text-halo-width']) p['text-halo-width']=1;
        if('icon-opacity' in p||/^poi/.test(id)) p['icon-opacity']=0.7;
      }else if(t==='circle'||t==='heatmap'){
        Object.keys(p).forEach(function(k){ if(/color/.test(k)) p[k]=mapCols(p[k],darkCol); });
      }
    });
    return st;
  }

  function render(){
    var sumN=function(a){ return a.reduce(function(t,r){ return t+(r.left||1); },0); };

      bs.textContent=near.length&&S.pos?tr('near',[near.length,NEAR_M]):tr('zone',[ZONE_M/1000]);

    }
    var h=$('hint');

        (voted?'':'<button type="button" data-a="vote" data-id="'+sp.id+'" data-v="-1">'+tr('gone')+'</button>'))+'</div></div>';

    $('card')._k=ck;

    renderMap();
  }

  /* ---------- acciones ---------- */
  function openSheet(kind){
    if(Date.now()-(S.last[kind==='go'?'leaving':kind]||0)<COOLDOWN){ showToast(tr('wait'),null,3500); return; }
    S.sel=null; S.carOpen=false; var hs=S.pos?streetAt(S.pos):null; S.sheet={kind:kind,n:1,size:(S.veh==='moto'?'moto':'medium'),zone:'free',pmr:false,ev:false,dir:hs?(hs.ow?'one':'two'):''}; render();
  }
  function send(kind0,ex){
    ex=ex||{};
    var see=(kind0==='see'), kind=see?'leaving':kind0;
    var now=Date.now();
    if(now-(S.last[kind0]||0)<COOLDOWN){ showToast(tr('wait'),null,3500); return; }
    needPos(function(ok){
      if(!ok){ S.gpsDenied=true; S.pick=kind0; S.pickEx=ex; clearTimeout(S.pickT); S.pickT=setTimeout(function(){ S.pick=null; },10000); showToast(tr('pick'),null,9000); return; }
      ensureStreets(S.pos); var pos=S.pos, wasManual=S.manual; S.manual=false; if(wasManual) S.pos=null;
      var p=[round4(pos[0]),round4(pos[1])];
      if(see){
        // Si ya hay un hueco avisado a menos de 15 m, no se duplica: se confirma.
        var dup=null;
        S.spots.forEach(function(s){ if(!dup&&!s.mine&&distPt(pos,[s.lat,s.lng])<=15) dup=s; });
        if(dup){
          if(!S.voted[dup.id]){ S.voted[dup.id]=true; dup.conf++; backend.vote(dup.id,1).then(refresh).then(render); }
          S.sel=dup.id; showToast(tr('dup'),null,5000); return;
        }
      }
      var nm=streetNameAt(pos);
      var r={id:uuid(),street:nm?norm(nm).slice(0,80):'zona',street_name:(nm||'Zona').slice(0,80),event:kind,lat:p[0],lng:p[1],spots:(kind==='leaving'&&ex.n>1)?ex.n:1,size:(kind==='leaving'&&ex.size)?ex.size:'',zone:(kind==='leaving'&&ex.zone)?ex.zone:'',dir:(kind==='leaving'&&ex.dir)?ex.dir:'',adapted:!!(kind==='leaving'&&ex.pmr),ev:!!(kind==='leaving'&&ex.ev)};
      S.last[kind0]=now;
      backend.add(r).then(function(){
        addMine(r.id);
        S.reports.push({id:r.id,event:kind,name:r.street_name,lat:p[0],lng:p[1],t:Date.now(),conf:0,deny:0,mine:true,n:r.spots,size:r.size,zone:r.zone,dir:r.dir,adapted:r.adapted,ev:r.ev});
        S.seen[r.id]=true; if(r.adapted&&!S.pmr){ S.pmr='on'; lsSet('hueco-pmr','on'); } computeSpots();
        S.spots.forEach(function(s){ if(s.id===r.id) s.mine=true; });
        if(see){ showToast(tr('sentSee'),r.id,1600); if(map) map.setView(p,Math.max(map.getZoom(),17)); }
        else if(kind==='leaving'){ showToast(tr('sentGo'),r.id,1600); if(map) map.setView(p,Math.max(map.getZoom(),17)); }
        else{ S.dest=null; lsSet('hueco-car',JSON.stringify({lat:p[0],lng:p[1],t:Date.now(),name:nm||''})); if(PAYAFTER){ S.notice=null; S.payOpen=true; S.payAfter=true; S.sel=null; S.carOpen=false; } else showToast(tr('parked')+tr('carSaved'),null,9000,'see'); }
        render(); refresh().then(function(){ S.spots.forEach(function(s){ if(s.id===r.id) s.mine=true; }); render(); });
      }).catch(function(e){ S.last[kind0]=0; showToast(tr('fail',[e.message]),null,6000); });
    });
  }
  document.addEventListener('click',function(ev){
    var b=ev.target.closest?ev.target.closest('button,[data-a]'):null; if(!b) return;
    var id=b.id, a=b.getAttribute('data-a');
    try{ if(navigator.vibrate&&(id==='bgo'||id==='bpark'||id==='bsee')) navigator.vibrate(8); }catch(e){}
    if(id==='bgo'){ if(S.sheet&&S.sheet.kind==='go'){ S.sheet=null; render(); } else openSheet('go'); }
    else if(id==='bpark') send('parked');
    else if(id==='bsee'){ if(S.sheet&&S.sheet.kind==='see'){ S.sheet=null; render(); } else openSheet('see'); }
    else if(id==='onbs'){ lsSet('hueco-onb','1'); $('onb').style.display='none'; startGPS(); }
    else if(id==='onbn'){ if(onbStep<2){ onbStep++; onbRender(); } else { lsSet('hueco-onb','1'); $('onb').style.display='none'; startGPS(); } }
    else if(id==='gear'){ S.settings=true; S.sheet=null; S.payOpen=false; S.carOpen=false; render(); }
    else if(a==='apy'){ S.notice=null; send('parked'); }
    else if(a==='agy'){ S.notice=null; render(); lsSet('hueco-car','null'); openSheet('go'); }
    else if(a==='ano'){ S.notice=null; AD.lastAsk=Date.now()+10*60000; render(); }
    else if(a==='sauto'){ AUTO=!AUTO; lsSet('hueco-auto',AUTO?'1':'0'); render(); }
    else if(a==='sly'){ var lk=b.getAttribute('data-v'); LAY[lk]=!LAY[lk]; lsSet('hueco-ly-'+(lk==='park'?'pk':(lk==='pmr'?'pm':'ev')),LAY[lk]?'1':'0'); var rp=refPoint(); if(rp) ensurePoi([rp[0]!==undefined?rp[0]:rp.lat,rp[1]!==undefined?rp[1]:rp.lng]); render(); }
    else if(a==='setx'){ S.settings=false; render(); }
    else if(a==='slang'){ LANG=b.getAttribute('data-v'); lsSet('hueco-lang',LANG); applyLang(); render(); }
    else if(a==='sth'){ THEME=b.getAttribute('data-v'); lsSet('hueco-theme',THEME); applyTheme(); render(); }
    else if(a==='sveh'){ S.veh=b.getAttribute('data-v'); lsSet('hueco-veh',S.veh); computeSpots(); render(); }
    else if(a==='spmr'){ S.pmr=b.getAttribute('data-v'); lsSet('hueco-pmr',S.pmr); computeSpots(); render(); }
    else if(a==='sfree'){ S.freeOnly=!S.freeOnly; lsSet('hueco-free',S.freeOnly?'1':'0'); computeSpots(); render(); }
    else if(a==='sev'){ S.evOnly=!S.evOnly; lsSet('hueco-ev',S.evOnly?'1':'0'); computeSpots(); render(); }
    else if(a==='srad'){ ZONE_M=Number(b.getAttribute('data-v')); lsSet('hueco-radius',String(ZONE_M)); computeSpots(); render(); }
    else if(a==='sal'){ ALERT_M=Number(b.getAttribute('data-v')); lsSet('hueco-alert',String(ALERT_M)); render(); }
    else if(a==='svib'){ VIB=!VIB; lsSet('hueco-vib',VIB?'1':'0'); if(VIB){ try{ navigator.vibrate&&navigator.vibrate(60); }catch(e){} } render(); }
    else if(a==='snav'){ lsSet('hueco-navpref',b.getAttribute('data-v')); render(); }
    else if(a==='spa'){ PAYAFTER=!PAYAFTER; lsSet('hueco-payafter',PAYAFTER?'1':'0'); render(); }
    else if(a==='spay'){ S.settings=false; S.payOpen=true; S.sel=null; render(); }
    else if(a==='scar'){ lsSet('hueco-car','null'); S.carOpen=false; render(); }
    else if(a==='sonb'){ S.settings=false; onbStep=0; $('onb').style.display='flex'; onbRender(); render(); }

    else if(id==='loc'){ needPos(function(ok){ if(ok&&map) map.setView(S.pos,17); else showToast(tr('nogps'),null,4000); }); }
    else if(a==='all'){ var zf=S.spots.filter(function(r){ return r.dz<=ZONE_M; }); if(map&&zf.length){ map.fit(zf.map(function(r){ return [r.lat,r.lng]; })); } }
    else if(a==='close'){ S.poiSel=null; S.sel=null; S.navFor=null; render(); }
    else if(a==='nav'){
      var nid=b.getAttribute('data-id'), np=lsGet('hueco-navpref')||'', nsp=S.spots.filter(function(x){ return x.id===nid; })[0];
      if(np&&nsp){ var na=navApps(nsp).filter(function(x){ return x[0]===np; })[0]; S.dest={id:nid,t:Date.now()}; lsSet('hueco-nav',np); if(na) window.open(na[2],'_blank'); }
      else{ S.navFor=nid; render(); }
    }
    else if(a==='navgo'){ lsSet('hueco-nav',b.getAttribute('data-app')); if(S.navFor) S.dest={id:S.navFor,t:Date.now()}; }
    else if(a==='gonew'){ S.sel=b.getAttribute('data-id'); S.navFor=S.sel; S.notice=null; S.carOpen=false; render(); }
    else if(a==='free'){ S.freeOnly=!S.freeOnly; lsSet('hueco-free',S.freeOnly?'1':'0'); computeSpots(); render(); }
    else if(a==='veh'){ var vs=['','car','moto']; S.veh=vs[(vs.indexOf(S.veh)+1)%vs.length]; lsSet('hueco-veh',S.veh); computeSpots(); render(); }
    else if(a==='ev'){ S.evOnly=!S.evOnly; lsSet('hueco-ev',S.evOnly?'1':'0'); computeSpots(); render(); }
    else if(a==='pmr'){ S.pmr=S.pmr===''?'on':(S.pmr==='on'?'only':''); lsSet('hueco-pmr',S.pmr); computeSpots(); render(); }
    else if(a==='theme'){ THEME=THEME==='auto'?'light':(THEME==='light'?'dark':'auto'); lsSet('hueco-theme',THEME); applyTheme(); render(); }
    else if(a==='pay'){ S.payOpen=!S.payOpen; S.payAfter=false; S.carOpen=false; S.sel=null; S.sheet=null; render(); }
    else if(a==='poix'){ S.poiSel=null; render(); }
    else if(a==='payx'){ S.payOpen=false; S.payAfter=false; render(); }
    else if(a==='car'){ S.carOpen=!S.carOpen; S.sel=null; S.sheet=null; render(); if(S.carOpen&&map){ var cc=getCar(); if(cc) map.setView([cc.lat,cc.lng],Math.max(map.getZoom(),17)); } }
    else if(a==='carx'){ S.carOpen=false; render(); }
    else if(a==='cargo'){ var cpf=carPref(getCar()); if(cpf){ lsSet('hueco-nav',cpf[0]); window.open(cpf[2],'_blank'); } }
    else if(a==='carforget'){ lsSet('hueco-car','null'); S.carOpen=false; render(); }
    else if(a==='sd'&&S.sheet){ var dv=b.getAttribute('data-v'); S.sheet.dir=(S.sheet.dir===dv?'':dv); render(); }
    else if(a==='se'&&S.sheet){ S.sheet.ev=!S.sheet.ev; render(); }
    else if(a==='sp'&&S.sheet){ S.sheet.pmr=!S.sheet.pmr; render(); }
    else if(a==='sg'&&S.sheet){ var gv=b.getAttribute('data-v'); S.sheet.zone=(S.sheet.zone===gv?'':gv); render(); }
    else if(a==='opensee'){ S.notice=null; openSheet('see'); }
    else if(a==='sheetx'){ S.sheet=null; render(); }
    else if(a==='sn'&&S.sheet){ S.sheet.n=Number(b.getAttribute('data-v')); render(); }
    else if(a==='sz'&&S.sheet){ var zv=b.getAttribute('data-v'); S.sheet.size=(S.sheet.size===zv?'':zv); render(); }
    else if(a==='sheetsend'&&S.sheet){ var sh2=S.sheet; S.sheet=null; render(); send(sh2.kind==='see'?'see':'leaving',{n:sh2.kind==='see'?sh2.n:1,size:sh2.size,zone:sh2.zone,dir:sh2.dir,pmr:sh2.pmr,ev:sh2.ev}); }
    else if(a==='undo'){
      var uid=b.getAttribute('data-id'); S.notice=null; S.last={};
      S.reports=S.reports.filter(function(r){ return r.id!==uid; }); computeSpots(); render();
      backend.cancel(uid).then(refresh).then(render);
    }
    else if(a==='del'){
      var did=b.getAttribute('data-id'); S.sel=null; S.last={};
      S.reports=S.reports.filter(function(r){ return r.id!==did; }); computeSpots(); render();
      backend.cancel(did).then(refresh).then(render);
    }
    else if(a==='ghost'){
      var gid2=b.getAttribute('data-id'); S.voted[gid2]=true; S.notice=null;
      var go=(S.ghosts||[]).filter(function(x){ return x.id===gid2; })[0];
      if(go){
        var nr={id:uuid(),street:norm(go.name||'zona').slice(0,80),street_name:(go.name||'Zona').slice(0,80),event:'leaving',lat:go.lat,lng:go.lng,spots:go.n||1,size:go.size||'',zone:go.zone||'',dir:go.dir||'',adapted:!!go.adapted,ev:!!go.ev};
        backend.vote(gid2,1).catch(function(){});
        backend.add(nr).then(function(){
          S.reports.push({id:nr.id,event:'leaving',name:nr.street_name,lat:nr.lat,lng:nr.lng,t:Date.now(),conf:0,deny:0,n:nr.spots,size:nr.size,zone:nr.zone,dir:nr.dir,adapted:nr.adapted,ev:nr.ev});
          S.seen[nr.id]=true; computeSpots(); showToast(tr('thx2'),null,4000); render();
        }).catch(function(){ showToast(tr('srv',['—']),null,4000); });
      }
      render();
    }
    else if(a==='vote'){
      var vid=b.getAttribute('data-id'), v=Number(b.getAttribute('data-v'));
      S.voted[vid]=true; S.notice=null;
      S.reports.forEach(function(r){ if(r.id===vid){ if(v>0) r.conf++; else r.deny++; } });
      computeSpots(); if(v<0) S.sel=null; render();
      backend.vote(vid,v).then(refresh).then(render);
    }
  });

  /* ---------- arranque ---------- */
  function start(){
    var sp0=$('splash');
    if(sp0){
      var wd='HUECCO'.split('').map(function(c){return '<span>'+c+'</span>';}).join('');
      sp0.innerHTML='<svg viewBox="0 0 120 120" aria-label="HUECCO"><defs><linearGradient id="cg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#D4FF3A" stop-opacity=".7"/><stop offset="1" stop-color="#D4FF3A" stop-opacity="0"/></linearGradient><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D4FF3A" stop-opacity=".6"/><stop offset="1" stop-color="#D4FF3A" stop-opacity="0"/></linearGradient></defs><line class="road" x1="60" y1="-220" x2="60" y2="340"/><rect class="hb hb-l" x="20" y="16" width="22" height="88" rx="4"/><rect class="hb hb-r" x="78" y="16" width="22" height="88" rx="4"/><circle class="ping" cx="60" cy="60" r="16"/><circle class="ping2" cx="60" cy="60" r="16"/><g class="car"><polygon class="cone" points="52,46 68,46 80,-34 40,-34" fill="url(#cg)"/><polygon class="trail" points="52,74 68,74 64,170 56,170" fill="url(#tg)"/><rect class="blk" x="50" y="46" width="20" height="28" rx="4"/></g></svg><div class="sw-word" aria-label="HUECCO">'+wd+'</div>';
      var done=false, endSplash=function(){ if(done) return; done=true; sp0.className='splash play hide'; setTimeout(function(){ if(sp0.parentNode) sp0.parentNode.removeChild(sp0); },450); };
      sp0.className='splash play'; sp0.addEventListener('click',endSplash); setTimeout(endSplash,2400);
    }
    S.loadingMsg=tr('loading'); render();
    applyLang(); initMap(); setupOnb();
    if(!REMOTE) seedDemo();
    refresh().then(function(){ S.loadingMsg=''; render(); });
    setInterval(function(){ if(!REMOTE) seedDemo(); refresh().then(render); },POLL);
    setInterval(function(){ computeSpots(); render(); },10000);
    // Nombres de calle: se cargan en segundo plano donde estés; si fallan, la app funciona igual.
    try{ localStorage.removeItem('plazas-calles-v2'); localStorage.removeItem('plazas-calles-v1'); }catch(e){}
    ensureStreets([(B[0]+B[2])/2,(B[1]+B[3])/2]);
  }
  if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
  start();
})();

</script>
