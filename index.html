<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hueco</title>
<meta name="theme-color" content="#1a73e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hueco">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout: mapa a pantalla completa; buscador y filtros flotando arriba; hoja inferior con las acciones. */
:root{
  --surface:#ffffff; --ink:#15232c; --muted:#5c6d77; --line:#dde4e8; --bg:#f1f4f6;
  --accent:#1a73e8; --accent-ink:#fff; --accent-soft:#e3eefd;
  --ok:#1e9e55; --ok-bg:#dcf3e5; --warn:#d98e12; --warn-bg:#fbeccb; --bad:#d04436; --bad-bg:#fadfdb;
  --display:'Sora',system-ui,sans-serif; --body:'Public Sans',system-ui,sans-serif;
  --sh:230px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--body);font-size:15px;line-height:1.4;color:var(--ink);background:var(--bg);overflow:hidden}
#app{position:fixed;inset:0}
#app.full{--sh:64%}
#map{position:absolute;inset:0;z-index:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h2,h3{font-family:var(--display);margin:0}
p{margin:0}
.top{position:absolute;z-index:500;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.bar{pointer-events:auto;display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:26px;padding:4px 14px;box-shadow:0 2px 10px rgba(0,0,0,.25);max-width:560px}
.bar svg{flex:none;color:var(--muted)}
.bar input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--ink);padding:10px 0}
.bar input:focus-visible{outline:none}
.chips{pointer-events:auto;display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.fchip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:7px 14px;font-weight:600;font-size:13.5px;box-shadow:0 1px 5px rgba(0,0,0,.2)}
.fchip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#toast{pointer-events:auto;max-width:560px}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;border-radius:12px;padding:11px 14px;font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.banner.ok{background:var(--ok);color:#fff}
.banner button{border:0;background:transparent;font-size:18px;line-height:1;padding:2px 8px;color:inherit}
.fab{position:absolute;z-index:500;right:12px;bottom:calc(var(--sh) + 14px);width:48px;height:48px;border-radius:50%;border:0;background:var(--surface);box-shadow:0 2px 10px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.attr{position:absolute;z-index:500;left:6px;bottom:calc(var(--sh) + 4px);font-size:10px;background:rgba(255,255,255,.8);padding:1px 5px;border-radius:4px;color:#333}
.sheet{position:absolute;z-index:600;left:0;right:0;bottom:0;height:var(--sh);background:var(--surface);border-radius:18px 18px 0 0;box-shadow:0 -3px 14px rgba(0,0,0,.25);display:flex;flex-direction:column;transition:height .2s}
.handle{flex:none;border:0;background:transparent;padding:10px 0 6px;display:flex;justify-content:center}
.handle i{width:40px;height:5px;border-radius:3px;background:var(--line)}
.cta{flex:none;display:flex;gap:10px;padding:0 14px 10px;max-width:720px;width:100%;margin:0 auto}
.cta button{flex:1;border-radius:26px;padding:14px 10px;font-weight:700;font-size:16px;border:0}
.cta .go{background:var(--accent);color:var(--accent-ink)}
.cta .park{background:var(--accent-soft);color:var(--accent)}
#sheetbody{flex:1;overflow-y:auto;padding:0 14px calc(14px + env(safe-area-inset-bottom));max-width:720px;width:100%;margin:0 auto}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-weight:600;font-size:12.5px;white-space:nowrap;background:var(--bg)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:#9a6208}
.note{font-size:13px;color:var(--muted);margin-top:6px}
.demo{font-size:12.5px;color:var(--muted);background:var(--bg);border-radius:10px;padding:8px 10px;margin:0 0 10px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.srow{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;border-top:1px solid var(--line);background:transparent;padding:12px 2px;text-align:left}
.srow .sname{font-weight:600;display:block}
.srow .ssub{font-size:12.5px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:22px;padding:10px 16px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.back{border:0;background:transparent;color:var(--accent);font-weight:600;padding:2px 0;margin-bottom:6px}
.chips2{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:9px 15px;font-weight:600;font-size:14px}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.inp{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;margin-top:10px}
.ann{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:9px 11px;margin-top:8px}
.ann .t{font-weight:600}
.ann .s{font-size:12.5px;color:var(--muted)}
.mini{display:flex;gap:6px}
.mini button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:600}
.mini button[disabled]{opacity:.5;cursor:default}
.mycar{background:var(--accent-soft);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.pinwrap{background:transparent;border:0}
.pin{display:flex;align-items:center;justify-content:center;min-width:28px;height:28px;padding:0 6px;border-radius:14px;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45);color:#fff;font:700 13px var(--display)}
.pin.ok{background:var(--ok)}
.pin.warn{background:var(--warn)}
.leaflet-container{font-family:var(--body)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="map" role="application" aria-label="Mapa de calles"></div>

  <div class="top">
    <div class="bar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar calle" aria-label="Buscar calle" autocomplete="off">
    </div>
    <div class="chips" role="group" aria-label="Filtros">
      <button type="button" class="fchip" data-act="filter" data-f="avisos" aria-pressed="true">Con avisos</button>
      <button type="button" class="fchip" data-act="filter" data-f="todas" aria-pressed="false">Todas las calles</button>
    </div>
    <div id="toast"></div>
  </div>

  <button type="button" class="fab" data-act="locate" aria-label="Centrar en mi ubicación">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><circle cx="12" cy="12" r="8"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg>
  </button>
  <div class="attr">© OpenStreetMap</div>

  <section class="sheet" aria-label="Avisos y acciones">
    <button type="button" class="handle" data-act="sheet" aria-label="Ampliar o reducir"><i></i></button>
    <div class="cta">
      <button type="button" class="go" data-act="form" data-kind="leaving">Me voy</button>
      <button type="button" class="park" data-act="form" data-kind="parked">He aparcado</button>
    </div>
    <div id="sheetbody"></div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
