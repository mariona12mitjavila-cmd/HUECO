<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hueco</title>
<meta name="theme-color" content="#0f1b2d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hueco">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --navy:#0f1b2d; --ink:#12202e; --muted:#5d6b78; --line:#e3e8ed;
  --go:#17a35a; --go-d:#0f8447; --park:#2563eb; --warn:#f0a21a; --old:#e4572e;
  --body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:var(--body);color:var(--ink);background:var(--navy);overflow:hidden;-webkit-user-select:none;user-select:none}
#map{position:fixed;inset:0;z-index:0}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}

/* Barra superior: una sola línea con lo importante */
.top{position:fixed;z-index:500;left:12px;right:12px;top:max(10px,env(safe-area-inset-top));display:flex;gap:10px;align-items:center;pointer-events:none}
.badge{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;border-radius:30px;padding:10px 18px 10px 12px;box-shadow:0 4px 16px rgba(0,0,0,.35);font-weight:700;font-size:17px;min-height:50px}
.badge .dot{width:30px;height:30px;border-radius:50%;background:var(--go);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800}
.badge.none .dot{background:#4b5b6e}
.badge small{display:block;font-weight:500;font-size:12.5px;opacity:.75;margin-top:1px}
.fab{pointer-events:auto;margin-left:auto;width:50px;height:50px;border-radius:50%;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;color:var(--park)}

/* Aviso flotante (enviado, deshacer…) */
#toast{position:fixed;z-index:700;left:12px;right:12px;top:calc(max(10px,env(safe-area-inset-top)) + 62px);display:flex;justify-content:center;pointer-events:none}
.tbox{pointer-events:auto;display:flex;gap:12px;align-items:center;background:#fff;color:var(--ink);border-radius:16px;padding:12px 16px;box-shadow:0 6px 22px rgba(0,0,0,.35);font-weight:600;max-width:560px;font-size:15px}
.tbox button{background:transparent;color:var(--park);font-weight:800;padding:6px 8px}

/* Tarjeta del hueco seleccionado */
.card{position:fixed;z-index:600;left:12px;right:12px;bottom:calc(150px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;background:#fff;border-radius:22px;padding:16px;box-shadow:0 8px 28px rgba(0,0,0,.4)}
.card h2{margin:0;font-size:20px}
.card .sub{color:var(--muted);margin-top:3px;font-size:15px}
.card .acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.card .acts a,.card .acts button{flex:1;min-width:96px;text-align:center;text-decoration:none;border-radius:14px;padding:13px 10px;font-weight:800;font-size:15.5px;background:#eef2f6;color:var(--ink)}
.card .acts .ir{background:var(--park);color:#fff}
.card .acts button[disabled]{opacity:.5}
.x{position:absolute;right:8px;top:8px;width:40px;height:40px;border-radius:50%;background:#eef2f6;font-size:20px;line-height:1}

/* Zona inferior: pista + dos botones enormes */
.bottom{position:fixed;z-index:500;left:0;right:0;bottom:0;padding:12px 12px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(15,27,45,.96) 70%,rgba(15,27,45,0))}
.hint{max-width:560px;margin:0 auto 10px;color:#fff;font-size:15px;font-weight:600;text-align:center;opacity:.95;min-height:22px}
.big{display:flex;gap:12px;max-width:560px;margin:0 auto}
.big button{flex:1;height:84px;border-radius:24px;font-weight:800;font-size:21px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.big button small{font-size:12.5px;font-weight:600;opacity:.9}
.big .go{background:var(--go)}
.big .go:active{background:var(--go-d)}
.big .park{background:var(--park)}
.big button[disabled]{opacity:.6}

/* Puntos del mapa */
.spotwrap{background:transparent;border:0}
.spot{position:relative;width:48px;height:48px;border-radius:50%;border:4px solid #fff;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;line-height:1;box-shadow:0 3px 10px rgba(0,0,0,.5)}
.spot b{font-size:19px}
.spot i{font-style:normal;font-size:10.5px;font-weight:700;margin-top:1px}
.spot.f{background:var(--go)}
.spot.m{background:var(--warn)}
.spot.o{background:var(--old)}
.spot.sel{transform:scale(1.25);z-index:9}
.spot.f::after{content:'';position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--go);opacity:0;animation:pulse 2s infinite}
@keyframes pulse{0%{transform:scale(.7);opacity:.7}100%{transform:scale(1.35);opacity:0}}
.me{width:20px;height:20px;border-radius:50%;background:#2f80ff;border:4px solid #fff;box-shadow:0 0 0 2px rgba(47,128,255,.4),0 2px 8px rgba(0,0,0,.4)}
.leaflet-container{background:#dfe6ec}
.leaflet-bottom.leaflet-left{margin-bottom:128px}
.leaflet-control-attribution{font-size:10px}
.attr{position:fixed;z-index:400;left:6px;top:calc(max(10px,env(safe-area-inset-top)) + 64px);font-size:10px;color:#222;background:rgba(255,255,255,.75);padding:1px 5px;border-radius:4px;display:none}
@media (prefers-reduced-motion:reduce){.spot.f::after{animation:none}}
</style>
</head>
<body>
<div id="map" role="application" aria-label="Mapa de huecos de aparcamiento"></div>

<div class="top">
  <div id="badge" class="badge none" role="status" aria-live="polite"><span class="dot">P</span><span><span id="bt">Cargando…</span><small id="bs"></small></span></div>
  <button type="button" class="fab" id="loc" aria-label="Centrar en mi ubicación">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><circle cx="12" cy="12" r="8"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg>
  </button>
</div>

<div id="toast"></div>
<div id="card"></div>

<div class="bottom">
  <div class="hint" id="hint"></div>
  <div class="big">
    <button type="button" class="go" id="bgo">Me voy<small>dejo mi hueco libre</small></button>
    <button type="button" class="park" id="bpark">He aparcado<small>ocupo un hueco</small></button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
