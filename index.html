<style>
:root{--bg:#f3f5f7;--panel:#ffffff;--txt:#1c2a39;--mut:#6b7c8e;--go:#2fae7c;--warn:#e3a82a;--old:#a5b0bc;--chip:#eef2f6;--fade:243,245,247;--wash:255,255,255;--tb:#1c2a39;--tbt:#fff;--sp:#fff;--cb:#1c2a39;--cbt:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--txt);background:var(--bg);overflow:hidden;-webkit-user-select:none;user-select:none}
#map{position:fixed;inset:0;z-index:0;background:var(--bg)}
.leaflet-container{background:var(--bg)}
.leaflet-tile-pane{filter:saturate(.85) brightness(1.03) contrast(.96)}
.leaflet-control-attribution{background:rgba(255,255,255,.7)!important;color:#7a8896!important;font-size:10px}
.leaflet-control-attribution a{color:#3b6fd8!important}
.leaflet-bottom.leaflet-left{margin-bottom:150px}
.maplibregl-ctrl-bottom-left{margin-bottom:150px}.maplibregl-ctrl-bottom-right{margin-bottom:150px}
.maplibregl-ctrl-attrib{font-size:10px}
body.inv .maplibregl-canvas{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.88) saturate(.45)}
.maplibregl-canvas{outline:none}
.spotwrap{pointer-events:auto}

button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.top{position:fixed;z-index:500;left:14px;right:14px;top:max(12px,env(safe-area-inset-top));display:flex;gap:10px;align-items:center;pointer-events:none}
.badge{cursor:pointer;pointer-events:auto;display:flex;align-items:center;gap:11px;background:rgba(var(--wash),.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:28px;padding:10px 18px 10px 14px;box-shadow:0 4px 18px rgba(28,42,57,.14);font-weight:600;font-size:16px;min-height:52px;transition:opacity .4s}
.badge .dot{width:12px;height:12px;border-radius:50%;background:var(--go);box-shadow:0 0 0 5px rgba(47,174,124,.2)}
.badge.none .dot{background:#aab5c0;box-shadow:none}
.badge small{display:block;font-weight:400;font-size:12.5px;color:var(--mut);margin-top:1px}
.fab,.lang{pointer-events:auto;width:48px;height:48px;border-radius:50%;background:var(--panel);box-shadow:0 4px 18px rgba(28,42,57,.14);display:flex;align-items:center;justify-content:center;color:#3b6fd8;font-weight:600;font-size:14px}
.fab{margin-left:auto}
#toast{position:fixed;z-index:700;left:14px;right:14px;top:calc(max(12px,env(safe-area-inset-top)) + 68px);display:flex;justify-content:center;pointer-events:none}
.tbox{pointer-events:auto;display:flex;gap:14px;align-items:center;background:var(--tb);color:var(--tbt);border-radius:18px;padding:12px 16px;box-shadow:0 8px 24px rgba(28,42,57,.28);font-weight:500;max-width:560px;font-size:15px}
.tbox button{background:transparent;color:#9cc0ff;font-weight:600;padding:6px 8px}
.card{position:fixed;z-index:600;left:14px;right:14px;bottom:calc(196px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;background:var(--panel);border-radius:22px;padding:16px;box-shadow:0 10px 30px rgba(28,42,57,.18)}
.card h2{margin:0;font-size:19px;font-weight:600;padding-right:44px}
.card .sub{color:var(--mut);margin-top:3px;font-size:14px}
.card .acts{display:flex;gap:8px;margin-top:14px}
.card .acts a,.card .acts button{flex:1;min-width:0;text-align:center;text-decoration:none;border-radius:14px;padding:13px 6px;font-weight:600;font-size:15px;background:var(--chip);color:var(--txt)}
.card .acts .ir{background:#3b6fd8;color:#fff}.card .acts a{font-size:14px}
.card .acts button[disabled]{opacity:.55}
.x{position:absolute;right:10px;top:10px;width:38px;height:38px;border-radius:50%;background:var(--chip);font-size:20px;line-height:1;color:var(--mut)}
.bottom{position:fixed;z-index:500;left:0;right:0;bottom:0;padding:0 14px calc(14px + env(safe-area-inset-bottom));pointer-events:none}
.hint{pointer-events:auto;width:max-content;max-width:calc(100% - 8px);margin:0 auto 10px;padding:8px 16px;border-radius:20px;background:rgba(var(--wash),.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 2px 12px rgba(28,42,57,.12);color:var(--mut);font-size:13.5px;font-weight:500;text-align:center;line-height:1.35}
.hint:empty{display:none}
.big{pointer-events:auto;display:flex;gap:6px;max-width:560px;margin:0 auto;padding:8px;border-radius:30px;background:rgba(var(--wash),.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 8px 30px rgba(28,42,57,.18)}
.big button{flex:1;min-width:0;border-radius:22px;padding:12px 2px 11px;background:transparent;color:var(--txt);display:flex;flex-direction:column;align-items:center;gap:7px;font-weight:600;font-size:13.5px;letter-spacing:.1px;transition:transform .15s,background .15s}
.big button:active{transform:scale(.96);background:var(--chip)}
.big .ic{width:46px;height:46px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.big .ic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.big .go .ic{background:rgba(47,174,124,.14);color:#1f9a6a}
.big .park .ic{background:rgba(59,111,216,.13);color:#3b6fd8}
.big .see .ic{background:rgba(42,154,168,.14);color:#238a97}
.big .lb{line-height:1.15;text-align:center;padding:0 2px}

.spotwrap{background:transparent;border:0}
.spot{position:relative;width:50px;height:50px;border-radius:50%;border:3px solid var(--sp);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;line-height:1;box-shadow:0 4px 14px rgba(28,42,57,.3);transition:transform .3s}
.spot b{font-size:20px}.spot i{font-style:normal;font-size:10.5px;font-weight:600;margin-top:1px}
.spot.f{background:var(--go)}.spot.m{background:var(--warn);color:#3a2a00}.spot.o{background:var(--old)}
.spot .cnt{position:absolute;top:-9px;right:-9px;min-width:22px;height:22px;border-radius:11px;background:var(--cb);color:var(--cbt);border:2px solid var(--sp);font-style:normal;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.chips{display:flex;gap:8px;margin-top:12px}
.chips button{flex:1;min-width:0;padding:12px 4px;border-radius:14px;background:var(--chip);color:var(--txt);font-weight:600;font-size:15px}
.chips button.on{background:#3b6fd8;color:#fff}
.sheet .sub{margin-top:14px}
.spot.sel{transform:scale(1.22)}
.spot.f::after{content:'';position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--go);opacity:0;animation:pulse 2.6s ease-out infinite}
@keyframes pulse{0%{transform:scale(.75);opacity:.6}100%{transform:scale(1.4);opacity:0}}
.me{width:20px;height:20px;border-radius:50%;background:#2f80ff;border:4px solid #fff;box-shadow:0 0 0 7px rgba(47,128,255,.22),0 2px 8px rgba(28,42,57,.3)}
#onb{position:fixed;z-index:900;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px}
.onbbox{max-width:360px;width:100%;text-align:center}
.onbp{width:118px;height:118px;border-radius:50%;background:var(--go);color:#fff;font-size:68px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 30px;box-shadow:0 0 0 14px rgba(47,174,124,.16),0 0 0 32px rgba(47,174,124,.08)}
.onbbox h1{font-size:28px;font-weight:600;margin:0 0 12px;line-height:1.2}
.onbbox p{font-size:17px;line-height:1.5;color:var(--mut);margin:0 0 12px}
.onbbox .tip{font-size:14px;color:#8a98a6}
.dots{display:flex;gap:8px;justify-content:center;margin:26px 0 22px}
.dots i{height:8px;border-radius:4px;background:var(--go);transition:width .3s}
#onbn{width:100%;height:58px;border-radius:20px;background:var(--go);color:#fff;font-size:18px;font-weight:600}
@media (prefers-color-scheme:dark){
:root{--bg:#0e1621;--panel:#142130;--txt:#e7eef6;--mut:#9db0c4;--go:#3fbf8a;--warn:#d9b44a;--old:#8794a6;--chip:#1e2d3f;--fade:14,22,33;--wash:20,33,48;--tb:#e7eef6;--tbt:#14202e;--sp:#e7eef6;--cb:#0e1621;--cbt:#e7eef6}
.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.88) saturate(.45)}
.leaflet-control-attribution{background:rgba(14,22,33,.75)!important;color:#7f93a8!important}
.leaflet-control-attribution a{color:#8fb4ff!important}
.fab,.lang{color:#8fb4ff}
.tbox button{color:#2d5fc4}
.hint{color:#cfdbe8;box-shadow:0 2px 12px rgba(0,0,0,.3)}.big{box-shadow:0 8px 30px rgba(0,0,0,.45)}.big .go .ic{color:#3fbf8a}.big .park .ic{color:#8fb4ff}.big .see .ic{color:#5fcfdb}
.badge,.fab,.lang,.card{box-shadow:0 6px 20px rgba(0,0,0,.4)}
.spot.f{color:#0e1621}.spot.o{color:#0e1621}
.onbp,#onbn{color:#0e1621}
}
@media (prefers-reduced-motion:reduce){.spot.f::after{animation:none}*{transition:none!important}}
</style>
</head>

</div>

          var a=metersFrom(p[0],p[1],seg[i-1][0],seg[i-1][1]), b=metersFrom(p[0],p[1],seg[i][0],seg[i][1]);
          var d=segDist([0,0],a,b); if(d<best){ best=d; name=st.name; }
        }
      });
    });
    return best<60?name:'';
  }
  /* ---------- calles reales (OpenStreetMap) ---------- */
  function buildStreets(osm){
    var by={};
    (osm.elements||[]).forEach(function(w){
      if(w.type!=='way'||!w.geometry||!w.tags||!w.tags.name) return;
      var pts=w.geometry.map(function(g){ return [g.lat,g.lon]; });
      if(pts.length<2) return;
      var k=norm(w.tags.name);
      var s=by[k]||(by[k]={key:k,name:w.tags.name,segs:[]});
      s.segs.push(pts);
    });
    return Object.keys(by).map(function(k){ return by[k]; });
  }
  function fetchTile(b,i,errs){
    if(i>=ENDPOINTS.length) return Promise.reject(new Error(errs.join(' · ')||'sin respuesta'));
    var q='[out:json][timeout:25];way["highway"~"^(primary|secondary|tertiary|residential|unclassified|living_street)$"]["name"]('+b.join(',')+');out geom;';
    var ctl=(typeof AbortController!=='undefined')?new AbortController():null;
    var timer=ctl?setTimeout(function(){ ctl.abort(); },20000):null;
    var host=ENDPOINTS[i].split('/')[2];
    var opts={};
    if(ctl) opts.signal=ctl.signal;
    // GET sencillo: evita problemas de CORS/preflight en Safari
    return fetch(ENDPOINTS[i]+'?data='+encodeURIComponent(q),opts)
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(j){ if(timer) clearTimeout(timer); if(!j||!j.elements) throw new Error('sin datos'); return j.elements; })
      .catch(function(e){ if(timer) clearTimeout(timer); errs.push(host+': '+(e&&e.name==='AbortError'?'tardó demasiado':(e&&e.message)||'error')); return fetchTile(b,i+1,errs); });
  }
  function fetchOverpass(){
    var b=CFG.BBOX||[41.484,2.358,41.545,2.425];
    var mlat=(b[0]+b[2])/2, mlon=(b[1]+b[3])/2;
    var tiles=[[b[0],b[1],mlat,mlon],[b[0],mlon,mlat,b[3]],[mlat,b[1],b[2],mlon],[mlat,mlon,b[2],b[3]]];
    var errs=[], all=[];
    // un trozo cada vez para no saturar el servidor gratuito
    return tiles.reduce(function(p,t){
      return p.then(function(){ return fetchTile(t,0,errs).then(function(els){ all=all.concat(els); }); });
    },Promise.resolve()).then(function(){
      if(!all.length) throw new Error('sin datos');
      var seen={}; all=all.filter(function(w){ if(seen[w.id]) return false; seen[w.id]=1; return true; });
      return {elements:all};
    });
  }
  function loadStreets(){
    var c=lsGet(CACHE_KEY);
    if(c){ try{ var d=JSON.parse(c); if(d&&d.length>10) return Promise.resolve(d); }catch(e){} }
    return fetchOverpass().then(function(osm){
      var d=buildStreets(osm);
      if(d.length<5) throw new Error('muy pocas calles');
      lsSet(CACHE_KEY,JSON.stringify(d));
      return d;
    });
  }

    return fetch(CFG.SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/'+path,{method:opt.method||'GET',headers:h,body:opt.body?JSON.stringify(opt.body):undefined})
      .then(function(r){
        if(!r.ok&&r.status!==409) return r.text().then(function(t){ throw new Error('HTTP '+r.status+(t?' '+t.slice(0,80):'')); });
        return r.text().then(function(t){ return t?JSON.parse(t):null; });
      });
  }
  var backend;

        if(!has) return api('reports',{method:'POST',body:base});

    backend={
      list:function(){ return Promise.resolve(local().filter(function(r){ return !r.cancelled; })); },

      vote:function(id,v){ var a=local(); a.forEach(function(r){ if(r.id===id){ if(v>0) r.confirms++; else r.denies++; } }); save(a); return Promise.resolve(); },

  /* ---------- huecos activos ---------- */
  function normReport(r){
    return {id:r.id,event:r.event,name:r.street_name,lat:r.lat,lng:r.lng,t:Date.parse(r.created_at),conf:r.confirms||0,deny:r.denies||0,n:Math.max(1,Math.min(20,r.spots||1)),size:r.size||''};
  }
  function computeSpots(){
    var now=Date.now(), rs=S.reports.filter(function(r){ return typeof r.lat==='number'&&typeof r.lng==='number'&&now-r.t<=TTL; });
    var parked=rs.filter(function(r){ return r.event==='parked'; });
    S.spots=rs.filter(function(r){
      if(r.event!=='leaving') return false;
      if((1+r.conf-1.5*r.deny)<=0) return false;
      var taken=parked.filter(function(p){ return p.t>r.t && distPt([p.lat,p.lng],[r.lat,r.lng])<=MERGE_M; }).length;
      r.left=Math.max(0,(r.n||1)-taken);
      return r.left>0;
    }).map(function(r){ r.d=S.pos?distPt(S.pos,[r.lat,r.lng]):null; r.mine=MINE.indexOf(r.id)>=0; return r; })
      .sort(function(a,b){ return (a.d!==null&&b.d!==null)?a.d-b.d:b.t-a.t; });
  }
  function refresh(){
    return backend.list().then(function(rows){
      S.reports=(rows||[]).map(normReport); S.error='';
      computeSpots(); checkNew();
    }).catch(function(e){ S.error=tr('srv',[e.message]); });
  }
  function checkNew(){
    var fresh=[];
    S.spots.forEach(function(r){
      if(S.seen[r.id]) return; S.seen[r.id]=true;
      if(!S.firstLoad||r.mine) return;
      if(S.pos&&r.d!==null&&r.d<=NEAR_M) fresh.push(r);
    });
    S.firstLoad=true;
    if(fresh.length){
      showToast(tr('fresh',[distLabel(fresh[0].d)]),null,6000);
      try{ if(navigator.vibrate) navigator.vibrate([250,120,250]); }catch(e){}
    }
  }

  /* ---------- ubicación ---------- */
  function startGPS(){
    if(!navigator.geolocation) return;
    navigator.geolocation.watchPosition(function(p){
      S.pos=[p.coords.latitude,p.coords.longitude]; S.acc=p.coords.accuracy;
      if(map&&!S.centered){ S.centered=true; map.setView(S.pos,17); }
      computeSpots(); render();
    },function(){ S.gpsDenied=true; render(); },{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
  }
  function needPos(cb){

    },function(){ cb(false); },{enableHighAccuracy:true,timeout:12000});

  }

  /* ---------- mapa ---------- */
  // Mapa vectorial moderno (MapLibre + OpenFreeMap, sin clave). Si no carga, vuelve al mapa clásico (Leaflet).
  var STYLE_LIGHT='https://tiles.openfreemap.org/styles/bright', STYLE_DARK='https://tiles.openfreemap.org/styles/dark';
  function isDark(){ try{ return !!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches); }catch(e){ return false; } }
  function webglOK(){ try{ var c=document.createElement('canvas'); return !!(window.WebGLRenderingContext&&(c.getContext('webgl2')||c.getContext('webgl'))); }catch(e){ return false; } }
  function onMapTap(lat,lng){
    if(S.pick){ var k=S.pick, kx=S.pickEx; S.pick=null; S.pos=[lat,lng]; S.manual=true; send(k,kx); return; }
    S.sel=null; S.navFor=null; render();

  function initGL(c){
    var dark=isDark();
    var gl=new maplibregl.Map({container:'map',style:dark?STYLE_DARK:STYLE_LIGHT,center:[c[1],c[0]],zoom:15,
      attributionControl:false,pitch:0,maxPitch:0,dragRotate:true,touchPitch:false});
    gl.addControl(new maplibregl.AttributionControl({compact:true}),'bottom-left');
    gl.addControl(new maplibregl.NavigationControl({showZoom:false,visualizePitch:false,showCompass:true}),'bottom-right');
    var switched=false;
    gl.on('error',function(){
      // si el estilo oscuro no existe, usa el claro invertido
      if(dark&&!switched&&!gl.isStyleLoaded()){ switched=true; document.body.classList.add('inv'); gl.setStyle(STYLE_LIGHT); }
    });
    gl.on('click',function(e){ onMapTap(e.lngLat.lat,e.lngLat.lng); });
    function el(html,sz){ var d=document.createElement('div'); d.className='spotwrap'; d.style.width=sz+'px'; d.style.height=sz+'px'; d.innerHTML=html; return d; }
    return {
      kind:'gl',
      setView:function(ll,z){ gl.easeTo({center:[ll[1],ll[0]],zoom:Math.max(0,z-1),duration:600}); },
      getZoom:function(){ return gl.getZoom()+1; },
      fit:function(list){ var b=new maplibregl.LngLatBounds(); list.forEach(function(p){ b.extend([p[1],p[0]]); }); gl.fitBounds(b,{padding:70,maxZoom:16,duration:600}); },
      addMarker:function(ll,html,sz,onClick){
        var e=el(html,sz); if(onClick) e.addEventListener('click',function(ev){ ev.stopPropagation(); onClick(); });
        var m=new maplibregl.Marker({element:e,anchor:'center'}).setLngLat([ll[1],ll[0]]).addTo(gl);
        return {setHtml:function(h){ e.innerHTML=h; },remove:function(){ m.remove(); },setLatLng:function(p){ m.setLngLat([p[1],p[0]]); }};
      }
    };
  }
  function initLeaf(c){
    var lm=L.map('map',{zoomControl:false,attributionControl:false}).setView(c,16);
    L.control.attribution({prefix:false,position:'bottomleft'}).addTo(lm);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(lm);
    lm.on('click',function(e){ onMapTap(e.latlng.lat,e.latlng.lng); });
    return {
      kind:'leaf',
      setView:function(ll,z){ lm.setView(ll,z); },
      getZoom:function(){ return lm.getZoom(); },
      fit:function(list){ lm.fitBounds(L.latLngBounds(list),{padding:[70,70],maxZoom:17}); },
      addMarker:function(ll,html,sz,onClick){
        var ic=L.divIcon({className:'spotwrap',iconSize:[sz,sz],iconAnchor:[sz/2,sz/2],html:html});
        var m=L.marker(ll,{icon:ic,keyboard:false,zIndexOffset:sz>30?500:1000,interactive:!!onClick}).addTo(lm);
        if(onClick) m.on('click',function(e){ L.DomEvent.stopPropagation(e); onClick(); });

      }

  function initMap(){

  function spotHtml(r,sel){

  function send(kind0,ex){
    ex=ex||{};
    var see=(kind0==='see'), kind=see?'leaving':kind0;
    var now=Date.now();
    if(now-(S.last[kind0]||0)<COOLDOWN){ showToast(tr('wait'),null,3500); return; }
    needPos(function(ok){
      if(!ok){ S.gpsDenied=true; S.pick=kind0; S.pickEx=ex; clearTimeout(S.pickT); S.pickT=setTimeout(function(){ S.pick=null; },10000); showToast(tr('pick'),null,9000); return; }
      var pos=S.pos, wasManual=S.manual; S.manual=false; if(wasManual) S.pos=null;
      var p=[round4(pos[0]),round4(pos[1])];
      if(see){
        // Si ya hay un hueco avisado a menos de 15 m, no se duplica: se confirma.
        var dup=null;
        S.spots.forEach(function(s){ if(!dup&&!s.mine&&distPt(pos,[s.lat,s.lng])<=15) dup=s; });
        if(dup){
          if(!S.voted[dup.id]){ S.voted[dup.id]=true; dup.conf++; backend.vote(dup.id,1).then(refresh).then(render); }
          S.sel=dup.id; showToast(tr('dup'),null,5000); return;
        }
      }
      var nm=streetNameAt(pos);
      var r={id:uuid(),street:nm?norm(nm).slice(0,80):'zona',street_name:(nm||'Zona').slice(0,80),event:kind,lat:p[0],lng:p[1],spots:(kind==='leaving'&&ex.n>1)?ex.n:1,size:(kind==='leaving'&&ex.size)?ex.size:''};
      S.last[kind0]=now;
      backend.add(r).then(function(){
        addMine(r.id);
        S.reports.push({id:r.id,event:kind,name:r.street_name,lat:p[0],lng:p[1],t:Date.now(),conf:0,deny:0,mine:true,n:r.spots,size:r.size});
        S.seen[r.id]=true; computeSpots();
        S.spots.forEach(function(s){ if(s.id===r.id) s.mine=true; });
        if(see){ showToast(tr('sentSee'),r.id,9000); if(map) map.setView(p,Math.max(map.getZoom(),17)); }
        else if(kind==='leaving'){ showToast(tr('sentGo'),r.id,9000); if(map) map.setView(p,Math.max(map.getZoom(),17)); }
        else showToast(tr('parked'),null,8000,'see');
        render(); refresh().then(function(){ S.spots.forEach(function(s){ if(s.id===r.id) s.mine=true; }); render(); });
      }).catch(function(e){ S.last[kind0]=0; showToast(tr('fail',[e.message]),null,6000); });
    });
  }
  document.addEventListener('click',function(ev){
    var b=ev.target.closest?ev.target.closest('button,[data-a]'):null; if(!b) return;
    var id=b.id, a=b.getAttribute('data-a');
    if(id==='bgo') openSheet('go');
    else if(id==='bpark') send('parked');
    else if(id==='bsee') openSheet('see');
    else if(id==='onbn'){ if(onbStep<2){ onbStep++; onbRender(); } else { lsSet('hueco-onb','1'); $('onb').style.display='none'; startGPS(); } }
    else if(id==='lang'){ LANG=LANG==='ca'?'es':(LANG==='es'?'en':'ca'); lsSet('hueco-lang',LANG); applyLang(); if(!lsGet('hueco-onb')) onbRender(); render(); }

    else if(id==='loc'){ needPos(function(ok){ if(ok&&map) map.setView(S.pos,17); else showToast(tr('nogps'),null,4000); }); }
    else if(a==='all'){ if(map&&S.spots.length){ map.fit(S.spots.map(function(r){ return [r.lat,r.lng]; })); } }
    else if(a==='close'){ S.sel=null; S.navFor=null; render(); }
    else if(a==='nav'){ S.navFor=b.getAttribute('data-id'); render(); }
    else if(a==='navgo'){ lsSet('hueco-nav',b.getAttribute('data-app')); }
    else if(a==='opensee'){ S.notice=null; openSheet('see'); }
    else if(a==='sheetx'){ S.sheet=null; render(); }
    else if(a==='sn'&&S.sheet){ S.sheet.n=Number(b.getAttribute('data-v')); render(); }
    else if(a==='sz'&&S.sheet){ var zv=b.getAttribute('data-v'); S.sheet.size=(S.sheet.size===zv?'':zv); render(); }
    else if(a==='sheetsend'&&S.sheet){ var sh2=S.sheet; S.sheet=null; render(); send(sh2.kind==='see'?'see':'leaving',{n:sh2.kind==='see'?sh2.n:1,size:sh2.size}); }
    else if(a==='undo'){
      var uid=b.getAttribute('data-id'); S.notice=null; S.last={};
      S.reports=S.reports.filter(function(r){ return r.id!==uid; }); computeSpots(); render();
      backend.cancel(uid).then(refresh).then(render);
    }
    else if(a==='del'){
      var did=b.getAttribute('data-id'); S.sel=null; S.last={};
      S.reports=S.reports.filter(function(r){ return r.id!==did; }); computeSpots(); render();
      backend.cancel(did).then(refresh).then(render);
    }
    else if(a==='vote'){
      var vid=b.getAttribute('data-id'), v=Number(b.getAttribute('data-v'));
      S.voted[vid]=true;
      S.reports.forEach(function(r){ if(r.id===vid){ if(v>0) r.conf++; else r.deny++; } });
      computeSpots(); if(v<0) S.sel=null; render();
      backend.vote(vid,v).then(refresh).then(render);
    }
  });

  /* ---------- arranque ---------- */
  function start(){
    S.loadingMsg=tr('loading'); render();
    applyLang(); initMap(); setupOnb();
    if(!REMOTE) seedDemo();
    refresh().then(function(){ S.loadingMsg=''; render(); });
    setInterval(function(){ if(!REMOTE) seedDemo(); refresh().then(render); },POLL);
    setInterval(function(){ computeSpots(); render(); },10000);
    // Nombres de calle: se cargan en segundo plano; si fallan, la app funciona igual.
    loadStreets().then(function(d){ S.streets=d; }).catch(function(){});
  }
  if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
  start();
})();

</script>
